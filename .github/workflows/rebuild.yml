name: Nightly rebuild

# Rebuilds the site every night so newly delivered P-Finder client sites
# appear without a commit. Requires the VERCEL_DEPLOY_HOOK repository secret
# (Vercel > Project > Settings > Git > Deploy Hooks).

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set, nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
